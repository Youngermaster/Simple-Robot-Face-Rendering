[package]
name = "robot-face-embedded"
version = "0.1.0"
edition = "2021"

[features]
default = ["simulator"]
simulator = ["dep:embedded-graphics-simulator"]

[dependencies]
embedded-graphics = "0.8.2"

[dependencies.embedded-graphics-simulator]
version = "0.8.0"
optional = true

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
