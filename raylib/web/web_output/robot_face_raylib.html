<html lang=en-us>

<head>
  <meta charset=utf-8>

  <title>Raylib Robot Face - WASM</title>
  <style>
    body {
      font-family: arial;

    .container {
      position: absolute;

      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center
    }

    #canvas {
      border: 2px solid #34495e;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5)
    }

    #status {
      color: #fff;
      padding: 20px;
      text-align: center
    }
  </style>
</head>

<body>

    <div id=status>Loading...</div><canvas id=canvas oncontextmenu=event.preventDefault()></canvas>
  </div>

</html>
