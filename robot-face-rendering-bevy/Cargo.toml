[package]
name = "robot-face-rendering-bevy"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
rand = "0.8"

# WASM-specific dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for WASM release builds
[profile.release]
opt-level = 3
lto = "thin"

# Optimize for WASM size
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
